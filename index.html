<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
/* phones held sideways: keep the laptop design and lay it out on a wider virtual page so it fits the short screen */
(() => {
  const m = document.querySelector('meta[name="viewport"]'), BASE = m.content, H = 700;
  const land = () => (screen.orientation && screen.orientation.type) ? screen.orientation.type.indexOf("landscape") === 0 : Math.abs(window.orientation || 0) === 90;
  let busy = false;
  function fit(){
    if (busy || !matchMedia("(pointer:coarse)").matches) return;
    busy = true; m.content = BASE;
    if (!land()){ busy = false; return; }
    requestAnimationFrame(() => requestAnimationFrame(() => {
      busy = false;
      // the device width, not innerWidth: a wide layout can already have zoomed the page out
      const w = Math.max(screen.width, screen.height), h = w * innerHeight / innerWidth;
      if (h >= 560 || w <= h) return;
      const W = Math.round(w * H / h), k = (w / W).toFixed(4); m.content = "width=" + W + ", initial-scale=" + k + ", minimum-scale=" + k + ", maximum-scale=" + k + ", viewport-fit=cover";
    }));
  }
  fit();
  addEventListener("orientationchange", () => setTimeout(fit, 300));
  if (screen.orientation) screen.orientation.addEventListener("change", () => setTimeout(fit, 300));
})();
</script>
<title>زيد · الإحسان</title>
<meta name="theme-color" content="#3D9A8E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>@import url("https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap");
/* Shared mechanics for all four Ihsan concepts.
   Each concept sets these variables and styles its own world. */
:root{
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-io:cubic-bezier(.77,0,.175,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  /* defaults, overridden per concept */
  --sheet-bg:#0E3D38; --sheet-fg:#fff; --sheet-muted:#CFE5E0; --sheet-line:rgba(255,255,255,.12);
  --accent:#D8B66E; --accent-ink:#0E3D38; --primary:#2E7F75; --primary-ink:#fff;
  --plate:linear-gradient(160deg,#EDE3CB,#D6C6A3); --danger:#C2452D; --radius:18px;
}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[data-a],[data-q]{touch-action:manipulation}

/* buttons used inside sheets and cards */
.btn{
  min-height:46px;border-radius:12px;border:0;padding:0 16px;font-size:15px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;
  transition:transform .16s var(--ease-out), background-color .25s ease, color .25s ease, box-shadow .25s ease;
}
.btn svg{width:18px;height:18px;flex:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.primary.done{background:transparent;color:var(--primary);box-shadow:inset 0 0 0 1.5px var(--primary)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.outline{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}

/* fly-to-cart dot and badge */
.fly{position:fixed;z-index:60;left:0;top:0;width:14px;height:14px;border-radius:99px;background:var(--danger);pointer-events:none;box-shadow:0 0 0 3px rgba(255,255,255,.75)}
.badge{
  position:absolute;top:-4px;inset-inline-end:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;
  background:var(--danger);color:#fff;font:800 11px/19px system-ui,sans-serif;text-align:center;
  transform:scale(.6);opacity:0;transition:transform .32s var(--ease-out),opacity .2s ease;pointer-events:none;
}
.badge.on{transform:scale(1);opacity:1}
.badge.bump{animation:bump .42s var(--ease-out)}
@keyframes bump{35%{transform:scale(1.35)}}

/* toast */
.toast{
  position:fixed;z-index:70;left:50%;top:calc(80px + var(--safe-t));
  display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:14px;
  background:var(--sheet-bg);color:var(--sheet-fg);font-size:15px;font-weight:600;white-space:nowrap;
  box-shadow:0 18px 40px -16px rgba(0,0,0,.5);
  transform:translate(-50%,-14px);opacity:0;pointer-events:none;
  transition:transform .4s var(--ease-out), opacity .3s ease;
}
.toast.on{transform:translate(-50%,0);opacity:1}
.toast svg{width:18px;height:18px;color:var(--accent)}

/* sheets */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(5,22,20,.55);opacity:0;pointer-events:none;transition:opacity .25s ease}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;z-index:90;left:50%;top:50%;width:min(480px,calc(100vw - 32px));max-height:min(780px,calc(100dvh - 40px));
  display:flex;flex-direction:column;border-radius:calc(var(--radius) + 6px);overflow:hidden;
  background:var(--sheet-bg);color:var(--sheet-fg);border:1px solid var(--sheet-line);
  box-shadow:0 40px 80px -30px rgba(0,0,0,.65);
  transform:translate(-50%,-48%) scale(.97);opacity:0;visibility:hidden;
  transition:transform .32s var(--ease-out), opacity .22s ease, visibility 0s linear .32s;
}
.sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1;visibility:visible;transition:transform .32s var(--ease-out), opacity .22s ease}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 10px 20px}
[dir="rtl"] .sheet header{padding:16px 20px 10px 16px}
.sheet h2{margin:0;font-size:19px;font-weight:800}
.sheet .x{width:40px;height:40px;border-radius:999px;border:0;background:color-mix(in srgb,var(--sheet-fg) 10%,transparent);display:grid;place-items:center}
.sheet .x svg{width:18px;height:18px}
.sheet .body{padding:4px 20px 20px;overflow-y:auto}
.sheet .foot{padding:12px 20px calc(18px + var(--safe-b));border-top:1px solid var(--sheet-line);display:flex;flex-direction:column;gap:10px}
@media (max-width:899px) and (orientation:portrait), (max-width:899px) and (min-height:541px), (orientation:portrait) and (max-width:1100px){
  .sheet{left:0;right:0;top:auto;bottom:0;width:100%;max-height:92dvh;border-radius:calc(var(--radius) + 6px) calc(var(--radius) + 6px) 0 0;border-bottom:0;
    transform:translateY(100%);opacity:1;transition:transform .42s var(--ease-drawer), visibility 0s linear .42s}
  .sheet.on{transform:translateY(0);transition:transform .42s var(--ease-drawer)}
  .toast{top:auto;bottom:calc(124px + var(--safe-b));transform:translate(-50%,14px)}
  .toast.on{transform:translate(-50%,0)}
}

/* scanner */
.viewfinder{position:relative;aspect-ratio:1/1;border-radius:var(--radius);overflow:hidden;background:#061815}
.viewfinder video{width:100%;height:100%;object-fit:cover;display:block}
.viewfinder .idle{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:#CFE5E0;font-size:14.5px;line-height:1.6}
.viewfinder .idle svg{width:44px;height:44px;margin:0 auto 10px;color:rgba(255,255,255,.5)}
.frame{position:absolute;inset:16%;pointer-events:none}
.frame i{position:absolute;width:34px;height:34px;border:3px solid #fff}
.frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:12px}
.frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:12px}
.frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:12px}
.frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:12px}
.frame b{position:absolute;left:6%;right:6%;height:2px;top:8%;background:var(--accent);box-shadow:0 0 12px 2px color-mix(in srgb,var(--accent) 60%,transparent);animation:sweep 2.2s var(--ease-io) infinite alternate}
@keyframes sweep{to{top:92%}}
.viewfinder.found .frame i{border-color:var(--accent)}
.viewfinder.found .frame b,.viewfinder.nocam .frame b{display:none}
.scan-note{margin:12px 2px 0;font-size:14px;color:var(--sheet-muted);line-height:1.55;text-align:center;min-height:2.6em}
.scan-note.err{color:#FFB4A2}

/* details */
.d-hero{border-radius:var(--radius);background:var(--plate);padding:18px;display:grid;place-items:center}
.d-hero img{max-height:300px;width:auto;mix-blend-mode:multiply}
.d-title{margin:16px 0 4px;font-size:22px;font-weight:800;line-height:1.3}
.d-price{font-size:20px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.d-text{margin:12px 0 0;font-size:15px;line-height:1.75;color:var(--sheet-muted)}
.meta{margin:16px 0 0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
.meta dt{color:var(--sheet-muted);opacity:.85}
.meta dd{margin:0;font-weight:600}
.meta dd.lat{direction:ltr;text-align:end}
[dir="ltr"] .meta dd.lat{text-align:start}

/* cart */
.c-item{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;padding:12px;border-radius:16px;background:color-mix(in srgb,var(--sheet-fg) 6%,transparent)}
.c-item .ph{width:72px;height:72px;border-radius:12px;background:var(--plate);display:grid;place-items:center;padding:6px}
.c-item .ph img{max-height:100%;width:auto;mix-blend-mode:multiply}
.c-item b{display:block;font-size:15.5px}
.c-item span{display:block;font-size:13px;color:var(--sheet-muted);margin-top:3px}
.c-item .rm{width:40px;height:40px;border-radius:999px;border:0;background:color-mix(in srgb,var(--sheet-fg) 8%,transparent);display:grid;place-items:center}
.c-item .rm svg{width:17px;height:17px}
.total{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;color:var(--sheet-muted)}
.total b{font-size:21px;color:var(--sheet-fg);font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:30px 10px 10px;color:var(--sheet-muted);font-size:15px;line-height:1.7}
.empty svg{width:48px;height:48px;margin:0 auto 10px;opacity:.5}
.success{text-align:center;padding:16px 6px 4px}
.success .ok{width:64px;height:64px;border-radius:999px;margin:0 auto 14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.success .ok svg{width:30px;height:30px}
.success h3{margin:0 0 6px;font-size:20px}
.success p{margin:0;color:var(--sheet-muted);line-height:1.7;font-size:14.5px}
.demo-tag{display:inline-block;margin-top:10px;font-size:12px;color:var(--sheet-muted);border:1px solid var(--sheet-line);border-radius:999px;padding:3px 10px}

/* streaming caret and typing dots */
.caret{display:inline-block;width:2px;height:1em;background:var(--accent);vertical-align:-2px;margin-inline-start:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dots i{width:6px;height:6px;border-radius:9px;background:var(--accent);animation:dot 1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}

/* speaking bars */
.bars{display:inline-flex;align-items:center;gap:2px;height:12px}
.bars i{width:2.5px;height:4px;border-radius:2px;background:var(--accent)}
.speaking .bars i{animation:eq .9s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}.bars i:nth-child(4){animation-delay:.45s}
@keyframes eq{50%{height:12px}}
body.paused .bars i{animation-play-state:paused}

/* concept switcher (review only) */
.switcher{
  position:fixed;z-index:50;inset-inline-end:14px;bottom:calc(14px + var(--safe-b));
  display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(0,0,0,.55);font:600 12px/1 system-ui,sans-serif;
}
.switcher a{color:#fff;text-decoration:none;padding:7px 10px;border-radius:999px;opacity:.75}
.switcher a[aria-current="page"]{background:#fff;color:#111;opacity:1}
@media (max-width:899px) and (orientation:portrait), (max-width:899px) and (min-height:541px), (orientation:portrait) and (max-width:1100px){.switcher{display:none}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
  .sheet,.toast,.badge{transition:opacity .2s ease!important}
  .frame b{display:none}
}
[data-thread]>*{flex-shrink:0}
/* phones: the speaking/listening indicator floats at the top of Zaid's stage */
@media (max-width:899px) and (orientation:portrait), (max-width:899px) and (min-height:541px), (orientation:portrait) and (max-width:1100px){
  [data-status]{position:fixed!important;z-index:30;top:calc(54px + var(--safe-t))!important;bottom:auto!important;left:50%!important;right:auto!important;transform:translateX(-50%)!important;
    display:flex!important;align-items:center;gap:7px;height:26px;padding:0 12px!important;border-radius:999px;background:rgba(0,0,0,.62)!important;color:#fff!important;font:600 12px/1 system-ui,sans-serif!important;white-space:nowrap;margin:0!important}
  [data-status]:not(.on){display:none!important}
  [data-status] .bars i{background:#FFD98A!important}
}

/* one plain, readable Arabic typeface everywhere (Tajawal, the booklet's own face) */
html body, html body *:not(svg):not(path){font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif!important;font-style:normal!important;letter-spacing:0!important}

/* composer: type a question, or tap the mic */
.composer{position:relative;z-index:8;display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;
  background:var(--sheet-bg);color:var(--sheet-fg);box-shadow:0 0 0 1px var(--sheet-line), 0 12px 26px -16px rgba(0,0,0,.55);margin-top:12px}
.c-in{flex:1;min-width:0;height:42px;border:0;background:transparent;color:inherit;font-size:15.5px;padding:0 14px;outline:none}
.c-in::placeholder{color:var(--sheet-muted);opacity:.85}
.composer:focus-within{box-shadow:0 0 0 2px var(--accent), 0 12px 26px -16px rgba(0,0,0,.55)}
.c-send,.c-mic{flex:none;width:42px;height:42px;border-radius:999px;border:0;display:grid;place-items:center;transition:transform .16s var(--ease-out)}
.c-send svg,.c-mic svg{width:19px;height:19px}
[dir="rtl"] .c-send svg{transform:scaleX(-1)}
.c-send{background:var(--primary);color:var(--primary-ink);opacity:.45}
.composer.has-text .c-send{opacity:1}
.c-mic{background:var(--accent);color:var(--accent-ink);display:none}
.c-mic.listening{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 35%,transparent)}
.c-send:active,.c-mic:active{transform:scale(.94)}

/* phones: composer pinned to the bottom; pause/mute float on Zaid's stage */
@media (max-width:899px) and (orientation:portrait), (max-width:899px) and (min-height:541px), (orientation:portrait) and (max-width:1100px){
  .composer{position:fixed!important;left:10px;right:10px;bottom:calc(10px + var(--safe-b));margin:0!important;z-index:40}
  .c-mic{display:grid}
  .c-send{display:none;opacity:1}
  .composer.has-text .c-send{display:grid}
  .composer.has-text .c-mic{display:none}
  [data-stage]{position:relative}
  [data-stage]>[data-voice]{position:absolute!important;z-index:6!important;top:auto!important;bottom:10px!important;left:auto!important;right:auto!important;inset-inline-end:10px!important;
    transform:none!important;display:flex!important;flex-direction:column!important;gap:8px!important;padding:0!important;margin:0!important;background:none!important;border:0!important;width:auto!important;height:auto!important;box-shadow:none!important}
  [data-stage]>[data-voice] [data-a="mic"]{display:none!important}
  [data-stage]>[data-voice] [data-a="pause"],[data-stage]>[data-voice] [data-a="mute"]{width:38px!important;height:38px!important;min-width:0!important;min-height:0!important;padding:0!important;border-radius:999px!important;
    display:grid!important;place-items:center!important;background:rgba(0,0,0,.45)!important;color:#fff!important;border:1px solid rgba(255,255,255,.35)!important;box-shadow:none!important;order:0!important}
  [data-stage]>[data-voice] [data-pt],[data-stage]>[data-voice] [data-mt]{display:none!important}
  [data-stage]>[data-voice] [data-pi],[data-stage]>[data-voice] [data-mi]{width:auto!important;height:auto!important;border:0!important;background:none!important;display:grid!important}
  [data-stage]>[data-voice] svg{width:16px!important;height:16px!important}
  [data-stage]>[data-voice] [data-a="pause"]:disabled{opacity:.45}
}
/* no partner logos on any page */
.powered{display:none!important}

/* phones: lock the page; only the answer box scrolls */
@media (max-width:899px) and (orientation:portrait), (max-width:899px) and (min-height:541px), (orientation:portrait) and (max-width:1100px){
  html,body{height:100%;overflow:hidden!important;overscroll-behavior:none}
  [data-thread]{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
}

/* review switcher: a slim vertical strip on the left edge of large screens */
@media (min-width:900px){
  .switcher{top:50%!important;bottom:auto!important;left:4px!important;right:auto!important;inset-inline-start:auto;inset-inline-end:auto;transform:translateY(-50%)!important;
    flex-direction:column;opacity:.45;transition:opacity .2s ease;font-size:11px;margin:0!important}
  .switcher a{padding:5px 6px;text-align:center}
  .switcher:hover,.switcher:focus-within{opacity:1}
}
/* phones: full screen is not available on iPhone; drop it to free the space above Zaid */
@media (max-width:899px) and (orientation:portrait), (max-width:899px) and (min-height:541px), (orientation:portrait) and (max-width:1100px){ [data-a="fs"]{display:none!important} }
/* composer focus: no double outline on the field; one soft ring around the pill */
.composer .c-in,.composer .c-in:focus,.composer .c-in:focus-visible{outline:none!important;box-shadow:none!important;border:0!important;border-radius:0!important;background:transparent!important}
.composer:focus-within{outline:none!important;box-shadow:0 0 0 1.5px color-mix(in srgb,var(--accent) 55%,transparent), 0 12px 26px -16px rgba(0,0,0,.55)!important}

/* phones: the page is exactly the screen; only the answer box scrolls */
@media (max-width:899px) and (orientation:portrait), (max-width:899px) and (min-height:541px), (orientation:portrait) and (max-width:1100px){
  html{height:100%;overflow:hidden}
  [data-app]{position:fixed!important;top:0!important;left:0!important;right:0!important;bottom:auto!important;
    height:var(--app-h,100dvh)!important;min-height:0!important;max-height:none!important;margin:0!important;overflow:hidden!important}
}

/* every screen: pause and mute are two small round buttons beside Zaid; the mic lives in the composer */
.c-mic{display:grid!important}
.c-send{display:none!important}
.composer.has-text .c-send{display:grid!important;opacity:1}
.composer.has-text .c-mic{display:none!important}
[data-stage]{position:relative}
[data-stage]>[data-voice]{position:absolute!important;z-index:6!important;top:auto!important;bottom:calc(var(--feet,0px) + 14px)!important;left:auto!important;right:auto!important;inset-inline-end:var(--side,14px)!important;
  transform:none!important;display:flex!important;flex-direction:column!important;gap:8px!important;padding:0!important;margin:0!important;background:none!important;border:0!important;width:auto!important;height:auto!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
[data-stage]>[data-voice] [data-a="mic"]{display:none!important}
[data-stage]>[data-voice] [data-a="pause"],[data-stage]>[data-voice] [data-a="mute"]{width:38px!important;height:38px!important;min-width:0!important;min-height:0!important;padding:0!important;border-radius:999px!important;
  display:grid!important;place-items:center!important;background:rgba(0,0,0,.42)!important;color:#fff!important;border:1px solid rgba(255,255,255,.35)!important;box-shadow:none!important;order:0!important;margin:0!important}
[data-stage]>[data-voice] [data-pt],[data-stage]>[data-voice] [data-mt]{display:none!important}
[data-stage]>[data-voice] [data-pi],[data-stage]>[data-voice] [data-mi]{width:auto!important;height:auto!important;border:0!important;background:none!important;display:grid!important}
[data-stage]>[data-voice] svg{width:16px!important;height:16px!important}
[data-stage]>[data-voice] [data-a="pause"]:disabled{opacity:.45}
[data-stage]>[data-voice] [data-status],[data-stage]>[data-voice] .status{display:none!important}

/* one small "speaking / listening" pill on Zaid's stage */
[data-stage]>.np{position:absolute!important;z-index:7;top:auto!important;bottom:calc(var(--feet,0px) + 14px)!important;left:50%!important;right:auto!important;transform:translateX(-50%)!important;
  display:flex!important;align-items:center;gap:7px;height:28px;padding:0 12px!important;border-radius:999px;background:rgba(0,0,0,.55)!important;color:#fff!important;
  font:600 12.5px/1 "Tajawal",system-ui,sans-serif!important;white-space:nowrap;margin:0!important;opacity:0;transition:opacity .2s ease;pointer-events:none}
[data-stage]>.np.on{opacity:1}
[data-stage]>.np .bars i{background:#FFD98A!important}

async function micDiagnose(code){
  const say = k => push({type:"plain", text:{ar:T.ar[k],en:T.en[k]}});

}
