<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
/* phones held sideways: keep the laptop design and lay it out on a wider virtual page so it fits the short screen */
(() => {
  const m = document.querySelector('meta[name="viewport"]'), BASE = m.content, H = 700;
  const land = () => (screen.orientation && screen.orientation.type) ? screen.orientation.type.indexOf("landscape") === 0 : Math.abs(window.orientation || 0) === 90;
  let busy = false;
  function fit(){
    if (busy || !matchMedia("(pointer:coarse)").matches) return;
    busy = true; m.content = BASE;
    if (!land()){ busy = false; return; }
    requestAnimationFrame(() => requestAnimationFrame(() => {
      busy = false;
      // the device width, not innerWidth: a wide layout can already have zoomed the page out
      const w = Math.max(screen.width, screen.height), h = w * innerHeight / innerWidth;
      if (h >= 560 || w <= h) return;
      const W = Math.round(w * H / h), k = (w / W).toFixed(4); m.content = "width=" + W + ", initial-scale=" + k + ", minimum-scale=" + k + ", maximum-scale=" + k + ", viewport-fit=cover";
    }));
  }
  fit();
  addEventListener("orientationchange", () => setTimeout(fit, 300));
  if (screen.orientation) screen.orientation.addEventListener("change", () => setTimeout(fit, 300));
})();
</script>
<title>ناصر · الإحسان</title>
<meta name="theme-color" content="#3D9A8E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>@import url("https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap");
/* Shared mechanics for all four Ihsan concepts.
   Each concept sets these variables and styles its own world. */
:root{
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-io:cubic-bezier(.77,0,.175,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  /* defaults, overridden per concept */
  --sheet-bg:#0E3D38; --sheet-fg:#fff; --sheet-muted:#CFE5E0; --sheet-line:rgba(255,255,255,.12);
  --accent:#E9C46A; --accent-ink:#0E3D38; --primary:#2E7F75; --primary-ink:#fff;
  --plate:linear-gradient(160deg,#EDE3CB,#D6C6A3); --danger:#C2452D; --radius:18px;
}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[data-a],[data-q]{touch-action:manipulation}

/* buttons used inside sheets and cards */
.btn{
  min-height:46px;border-radius:12px;border:0;padding:0 16px;font-size:15px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;
  transition:transform .16s var(--ease-out), background-color .25s ease, color .25s ease, box-shadow .25s ease;
}
.btn svg{width:18px;height:18px;flex:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.primary.done{background:transparent;color:var(--primary);box-shadow:inset 0 0 0 1.5px var(--primary)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.outline{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}

/* fly-to-cart dot and badge */
.fly{position:fixed;z-index:60;left:0;top:0;width:14px;height:14px;border-radius:99px;background:var(--danger);pointer-events:none;box-shadow:0 0 0 3px rgba(255,255,255,.75)}
.badge{
  position:absolute;top:-4px;inset-inline-end:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;
  background:var(--danger);color:#fff;font:800 11px/19px system-ui,sans-serif;text-align:center;
  transform:scale(.6);opacity:0;transition:transform .32s var(--ease-out),opacity .2s ease;pointer-events:none;
}
.badge.on{transform:scale(1);opacity:1}
.badge.bump{animation:bump .42s var(--ease-out)}
@keyframes bump{35%{transform:scale(1.35)}}

/* toast */
.toast{
  position:fixed;z-index:70;left:50%;top:calc(80px + var(--safe-t));
  display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:14px;
  background:var(--sheet-bg);color:var(--sheet-fg);font-size:15px;font-weight:600;white-space:nowrap;
  box-shadow:0 18px 40px -16px rgba(0,0,0,.5);
  transform:translate(-50%,-14px);opacity:0;pointer-events:none;
  transition:transform .4s var(--ease-out), opacity .3s ease;
}
.toast.on{transform:translate(-50%,0);opacity:1}
.toast svg{width:18px;height:18px;color:var(--accent)}

/* sheets */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(5,22,20,.55);opacity:0;pointer-events:none;transition:opacity .25s ease}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;z-index:90;left:50%;top:50%;width:min(480px,calc(100vw - 32px));max-height:min(780px,calc(100dvh - 40px));
  display:flex;flex-direction:column;border-radius:calc(var(--radius) + 6px);overflow:hidden;
  background:var(--sheet-bg);color:var(--sheet-fg);border:1px solid var(--sheet-line);
  box-shadow:0 40px 80px -30px rgba(0,0,0,.65);
  transform:translate(-50%,-48%) scale(.97);opacity:0;visibility:hidden;
  transition:transform .32s var(--ease-out), opacity .22s ease, visibility 0s linear .32s;
}
.sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1;visibility:visible;transition:transform .32s var(--ease-out), opacity .22s ease}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 10px 20px}
[dir="rtl"] .sheet header{padding:16px 20px 10px 16px}
.sheet h2{margin:0;font-size:19px;font-weight:800}
.sheet .x{width:40px;height:40px;border-radius:999px;border:0;background:color-mix(in srgb,var(--sheet-fg) 10%,transparent);display:grid;place-items:center}
.sheet .x svg{width:18px;height:18px}
.sheet .body{padding:4px 20px 20px;overflow-y:auto}
.sheet .foot{padding:12px 20px calc(18px + var(--safe-b));border-top:1px solid var(--sheet-line);display:flex;flex-direction:column;gap:10px}
@media (max-width:899px) and (orientation:portrait), (max-width:899px) and (min-height:541px), (orientation:portrait) and (max-width:1100px){
  .sheet{left:0;right:0;top:auto;bottom:0;width:100%;max-height:92dvh;border-radius:calc(var(--radius) + 6px) calc(var(--radius) + 6px) 0 0;border-bottom:0;
    transform:translateY(100%);opacity:1;transition:transform .42s var(--ease-drawer), visibility 0s linear .42s}
  .sheet.on{transform:translateY(0);transition:transform .42s var(--ease-drawer)}
  .toast{top:auto;bottom:calc(124px + var(--safe-b));transform:translate(-50%,14px)}
  .toast.on{transform:translate(-50%,0)}
}

/* scanner */
.viewfinder{position:relative;aspect-ratio:1/1;border-radius:var(--radius);overflow:hidden;background:#061815}
.viewfinder video{width:100%;height:100%;object-fit:cover;display:block}
.viewfinder .idle{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:#CFE5E0;font-size:14.5px;line-height:1.6}
.viewfinder .idle svg{width:44px;height:44px;margin:0 auto 10px;color:rgba(255,255,255,.5)}
.frame{position:absolute;inset:16%;pointer-events:none}
.frame i{position:absolute;width:34px;height:34px;border:3px solid #fff}
.frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:12px}
.frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:12px}
.frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:12px}
.frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:12px}
.frame b{position:absolute;left:6%;right:6%;height:2px;top:8%;background:var(--accent);box-shadow:0 0 12px 2px color-mix(in srgb,var(--accent) 60%,transparent);animation:sweep 2.2s var(--ease-io) infinite alternate}
@keyframes sweep{to{top:92%}}
.viewfinder.found .frame i{border-color:var(--accent)}
.viewfinder.found .frame b,.viewfinder.nocam .frame b{display:none}
.scan-note{margin:12px 2px 0;font-size:14px;color:var(--sheet-muted);line-height:1.55;text-align:center;min-height:2.6em}
.scan-note.err{color:#FFB4A2}

/* details */
.d-hero{border-radius:var(--radius);background:var(--plate);padding:18px;display:grid;place-items:center}
.d-hero img{max-height:300px;width:auto;mix-blend-mode:multiply}
.d-title{margin:16px 0 4px;font-size:22px;font-weight:800;line-height:1.3}
.d-price{font-size:20px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.d-text{margin:12px 0 0;font-size:15px;line-height:1.75;color:var(--sheet-muted)}
.meta{margin:16px 0 0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
.meta dt{color:var(--sheet-muted);opacity:.85}
.meta dd{margin:0;font-weight:600}
.meta dd.lat{direction:ltr;text-align:end}
[dir="ltr"] .meta dd.lat{text-align:start}

/* cart */
.c-item{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;padding:12px;border-radius:16px;background:color-mix(in srgb,var(--sheet-fg) 6%,transparent)}
.c-item .ph{width:72px;height:72px;border-radius:12px;background:var(--plate);display:grid;place-items:center;padding:6px}
.c-item .ph img{max-height:100%;width:auto;mix-blend-mode:multiply}
.c-item b{display:block;font-size:15.5px}
.c-item span{display:block;font-size:13px;color:var(--sheet-muted);margin-top:3px}
.c-item .rm{width:40px;height:40px;border-radius:999px;border:0;background:color-mix(in srgb,var(--sheet-fg) 8%,transparent);display:grid;place-items:center}
.c-item .rm svg{width:17px;height:17px}
.total{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;color:var(--sheet-muted)}
.total b{font-size:21px;color:var(--sheet-fg);font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:30px 10px 10px;color:var(--sheet-muted);font-size:15px;line-height:1.7}
.empty svg{width:48px;height:48px;margin:0 auto 10px;opacity:.5}
.success{text-align:center;padding:16px 6px 4px}
.success .ok{width:64px;height:64px;border-radius:999px;margin:0 auto 14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.success .ok svg{width:30px;height:30px}
.success h3{margin:0 0 6px;font-size:20px}
.success p{margin:0;color:var(--sheet-muted);line-height:1.7;font-size:14.5px}
.demo-tag{display:inline-block;margin-top:10px;font-size:12px;color:var(--sheet-muted);border:1px solid var(--sheet-line);border-radius:999px;padding:3px 10px}

/* streaming caret and typing dots */
.caret{display:inline-block;width:2px;height:1em;background:var(--accent);vertical-align:-2px;margin-inline-start:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dots i{width:6px;height:6px;border-radius:9px;background:var(--accent);animation:dot 1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}

/* speaking bars */
.bars{display:inline-flex;align-items:center;gap:2px;height:12px}
.bars i{width:2.5px;height:4px;border-radius:2px;background:var(--accent)}
.speaking .bars i{animation:eq .9s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}.bars i:nth-child(4){animation-delay:.45s}
@keyframes eq{50%{height:12px}}
body.paused .bars i{animation-play-state:paused}

/* concept switcher (review only) */
.switcher{
  position:fixed;z-index:50;inset-inline-end:14px;bottom:calc(14px + var(--safe-b));
  display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(0,0,0,.55);font:600 12px/1 system-ui,sans-serif;
}
.switcher a{color:#fff;text-decoration:none;padding:7px 10px;border-radius:999px;opacity:.75}
.switcher a[aria-current="page"]{background:#fff;color:#111;opacity:1}
@media (max-width:899px) and (orientation:portrait), (max-width:899px) and (min-height:541px), (orientation:portrait) and (max-width:1100px){.switcher{display:none}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
  .sheet,.toast,.badge{transition:opacity .2s ease!important}
  .frame b{display:none}
}
[data-thread]>*{flex-shrink:0}
/* phones: the speaking/listening indicator floats at the top of Nasser's stage */
@media (max-width:899px) and (orientation:portrait), (max-width:899px) and (min-height:541px), (orientation:portrait) and (max-width:1100px){
  [data-status]{position:fixed!important;z-index:30;top:calc(54px + var(--safe-t))!important;bottom:auto!important;left:50%!important;right:auto!important;transform:translateX(-50%)!important;
    display:flex!important;align-items:center;gap:7px;height:26px;padding:0 12px!important;border-radius:999px;background:rgba(0,0,0,.62)!important;color:#fff!important;font:600 12px/1 system-ui,sans-serif!important;white-space:nowrap;margin:0!important}
  [data-status]:not(.on){display:none!important}
  [data-status] .bars i{background:#FFD98A!important}
}

/* one plain, readable Arabic typeface everywhere (Tajawal, the booklet's own face) */
html body, html body *:not(svg):not(path){font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif!important;font-style:normal!important;letter-spacing:0!important}

/* composer: type a question, or tap the mic */
.composer{position:relative;z-index:8;display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;
  background:var(--sheet-bg);color:var(--sheet-fg);box-shadow:0 0 0 1px var(--sheet-line), 0 12px 26px -16px rgba(0,0,0,.55);margin-top:12px}
.c-in{flex:1;min-width:0;height:42px;border:0;background:transparent;color:inherit;font-size:15.5px;padding:0 14px;outline:none}
.c-in::placeholder{color:var(--sheet-muted);opacity:.85}
.composer:focus-within{box-shadow:0 0 0 2px var(--accent), 0 12px 26px -16px rgba(0,0,0,.55)}
.c-send,.c-mic{flex:none;width:42px;height:42px;border-radius:999px;border:0;display:grid;place-items:center;transition:transform .16s var(--ease-out)}
.c-send svg,.c-mic svg{width:19px;height:19px}
[dir="rtl"] .c-send svg{transform:scaleX(-1)}
.c-send{background:var(--primary);color:var(--primary-ink);opacity:.45}
.composer.has-text .c-send{opacity:1}
.c-mic{background:var(--accent);color:var(--accent-ink);display:none}
.c-mic.listening{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 35%,transparent)}
.c-send:active,.c-mic:active{transform:scale(.94)}

/* phones: composer pinned to the bottom; pause/mute float on Nasser's stage */
@media (max-width:899px) and (orientation:portrait), (max-width:899px) and (min-height:541px), (orientation:portrait) and (max-width:1100px){
  .composer{position:fixed!important;left:10px;right:10px;bottom:calc(10px + var(--safe-b));margin:0!important;z-index:40}
  .c-mic{display:grid}
  .c-send{display:none;opacity:1}
  .composer.has-text .c-send{display:grid}
  .composer.has-text .c-mic{display:none}
  [data-stage]{position:relative}
  [data-stage]>[data-voice]{position:absolute!important;z-index:6!important;top:auto!important;bottom:10px!important;left:auto!important;right:auto!important;inset-inline-end:10px!important;
    transform:none!important;display:flex!important;flex-direction:column!important;gap:8px!important;padding:0!important;margin:0!important;background:none!important;border:0!important;width:auto!important;height:auto!important;box-shadow:none!important}
  [data-stage]>[data-voice] [data-a="mic"]{display:none!important}
  [data-stage]>[data-voice] [data-a="pause"],[data-stage]>[data-voice] [data-a="mute"]{width:38px!important;height:38px!important;min-width:0!important;min-height:0!important;padding:0!important;border-radius:999px!important;
    display:grid!important;place-items:center!important;background:rgba(0,0,0,.45)!important;color:#fff!important;border:1px solid rgba(255,255,255,.35)!important;box-shadow:none!important;order:0!important}
  [data-stage]>[data-voice] [data-pt],[data-stage]>[data-voice] [data-mt]{display:none!important}
  [data-stage]>[data-voice] [data-pi],[data-stage]>[data-voice] [data-mi]{width:auto!important;height:auto!important;border:0!important;background:none!important;display:grid!important}
  [data-stage]>[data-voice] svg{width:16px!important;height:16px!important}
  [data-stage]>[data-voice] [data-a="pause"]:disabled{opacity:.45}
}
/* no partner logos on any page */
.powered{display:none!important}

/* phones: lock the page; only the answer box scrolls */
@media (max-width:899px) and (orientation:portrait), (max-width:899px) and (min-height:541px), (orientation:portrait) and (max-width:1100px){
  html,body{height:100%;overflow:hidden!important;overscroll-behavior:none}
  [data-thread]{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
}

/* review switcher: a slim vertical strip on the left edge of large screens */
@media (min-width:900px){
  .switcher{top:50%!important;bottom:auto!important;left:4px!important;right:auto!important;inset-inline-start:auto;inset-inline-end:auto;transform:translateY(-50%)!important;
    flex-direction:column;opacity:.45;transition:opacity .2s ease;font-size:11px;margin:0!important}
  .switcher a{padding:5px 6px;text-align:center}
  .switcher:hover,.switcher:focus-within{opacity:1}
}
/* phones: full screen is not available on iPhone; drop it to free the space above Nasser */
@media (max-width:899px) and (orientation:portrait), (max-width:899px) and (min-height:541px), (orientation:portrait) and (max-width:1100px){ [data-a="fs"]{display:none!important} }
/* composer focus: no double outline on the field; one soft ring around the pill */
.composer .c-in,.composer .c-in:focus,.composer .c-in:focus-visible{outline:none!important;box-shadow:none!important;border:0!important;border-radius:0!important;background:transparent!important}
.composer:focus-within{outline:none!important;box-shadow:0 0 0 1.5px color-mix(in srgb,var(--accent) 55%,transparent), 0 12px 26px -16px rgba(0,0,0,.55)!important}

/* phones: the page is exactly the screen; only the answer box scrolls */
@media (max-width:899px) and (orientation:portrait), (max-width:899px) and (min-height:541px), (orientation:portrait) and (max-width:1100px){
  html{height:100%;overflow:hidden}
  [data-app]{position:fixed!important;top:0!important;left:0!important;right:0!important;bottom:auto!important;
    height:var(--app-h,100dvh)!important;min-height:0!important;max-height:none!important;margin:0!important;overflow:hidden!important}
}

/* every screen: pause and mute are two small round buttons beside Nasser; the mic lives in the composer */
.c-mic{display:grid!important}
.c-send{display:none!important}
.composer.has-text .c-send{display:grid!important;opacity:1}
.composer.has-text .c-mic{display:none!important}
[data-stage]{position:relative}
[data-stage]>[data-voice]{position:absolute!important;z-index:6!important;top:auto!important;bottom:calc(var(--feet,0px) + 14px)!important;left:auto!important;right:auto!important;inset-inline-end:var(--side,14px)!important;
  transform:none!important;display:flex!important;flex-direction:column!important;gap:8px!important;padding:0!important;margin:0!important;background:none!important;border:0!important;width:auto!important;height:auto!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
[data-stage]>[data-voice] [data-a="mic"]{display:none!important}
[data-stage]>[data-voice] [data-a="pause"],[data-stage]>[data-voice] [data-a="mute"]{width:38px!important;height:38px!important;min-width:0!important;min-height:0!important;padding:0!important;border-radius:999px!important;
  display:grid!important;place-items:center!important;background:rgba(0,0,0,.42)!important;color:#fff!important;border:1px solid rgba(255,255,255,.35)!important;box-shadow:none!important;order:0!important;margin:0!important}
[data-stage]>[data-voice] [data-pt],[data-stage]>[data-voice] [data-mt]{display:none!important}
[data-stage]>[data-voice] [data-pi],[data-stage]>[data-voice] [data-mi]{width:auto!important;height:auto!important;border:0!important;background:none!important;display:grid!important}
[data-stage]>[data-voice] svg{width:16px!important;height:16px!important}
[data-stage]>[data-voice] [data-a="pause"]:disabled{opacity:.45}
[data-stage]>[data-voice] [data-status],[data-stage]>[data-voice] .status{display:none!important}

/* one small "speaking / listening" pill on Nasser's stage */
[data-stage]>.np{position:absolute!important;z-index:7;top:auto!important;bottom:calc(var(--feet,0px) + 14px)!important;left:50%!important;right:auto!important;transform:translateX(-50%)!important;
  display:flex!important;align-items:center;gap:7px;height:28px;padding:0 12px!important;border-radius:999px;background:rgba(0,0,0,.55)!important;color:#fff!important;
  font:600 12.5px/1 "Tajawal",system-ui,sans-serif!important;white-space:nowrap;margin:0!important;opacity:0;transition:opacity .2s ease;pointer-events:none}
[data-stage]>.np.on{opacity:1}
[data-stage]>.np .bars i{background:#FFD98A!important}

#avatar .nasser-canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:bottom;pointer-events:none;opacity:0;transition:opacity .3s ease;z-index:1}
#avatar.nv-on .nasser-canvas{opacity:1}
#avatar.nv-on.nv-out .nasser-canvas{opacity:0}
#avatar.nv-stacked .nasser{visibility:visible!important;opacity:1;transition:opacity .3s ease}
#avatar.nv-stacked.nv-on:not(.nv-out) .nasser{opacity:0;transition-delay:.3s}
#avatar.nv-stacked.nv-out .nasser{opacity:1;transition:none}
#avatar.nv-stacked .nasser-video{position:absolute!important;width:2px!important;height:2px!important;opacity:0!important;display:block!important;pointer-events:none}

/* ---- 18 Nov ---- */
/* one shadow for Nasser, cast by his box: the still and every clip share it, so it never doubles or jumps
   while one morphs into the other, and the bottom fade can no longer cut it into a hard edge */
#avatar .nasser,#avatar .nasser-video,#avatar .nasser-canvas{filter:none!important}
#avatar{filter:drop-shadow(16px 10px 18px rgba(3,30,28,.38)) drop-shadow(4px 4px 6px rgba(3,30,28,.25))}
#avatar:not(.nv-on) .nasser-canvas{visibility:hidden}

/* clips: the side edges of the frame melt away, so a hand that reaches the edge fades out instead of ending on a straight line */
#avatar .nasser-canvas,.i-nasser .i-canvas{
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)!important;
          mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)!important}
@media (min-width:900px) and (orientation:landscape), (min-width:1101px), (orientation:landscape) and (max-height:540px){
  #avatar .nasser-canvas{
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent),linear-gradient(180deg,#000 95%,transparent 100%)!important;
            mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent),linear-gradient(180deg,#000 95%,transparent 100%)!important;
    -webkit-mask-composite:source-in;mask-composite:intersect}
}
.intro.placed .i-nasser .i-canvas{
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent),linear-gradient(180deg,#000 94%,transparent 99%)!important;
          mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent),linear-gradient(180deg,#000 94%,transparent 99%)!important;
  -webkit-mask-composite:source-in;mask-composite:intersect}

/* laptop question cards: the same dark glass without the live blur. Where Nasser's picture ran under a card, the blur
   was drawn in two parts and left a straight seam through the card (seen on the scan card) */
@media (min-width:900px) and (orientation:landscape), (min-width:1101px), (orientation:landscape) and (max-height:540px){
  .stage .qs .qp{-webkit-backdrop-filter:none;backdrop-filter:none;
    background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,0) 50%),rgba(0,57,56,.72)}
  @media (hover:hover) and (pointer:fine){.stage .qs .qp:hover{background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.04) 50%),rgba(0,57,56,.72)}}
}

/* details opened from a collection: back sits at the start of the header, close at the end */
#detailSheet header{justify-content:flex-start}
#detailSheet header h2{flex:1;min-width:0}
.sheet .x.back[hidden]{display:none}
.sheet .x{transition:transform .16s var(--ease-out),background-color .2s ease}
.sheet .x:active{transform:scale(.94)}
.sheet .x:focus-visible{outline:2px solid #E7B957;outline-offset:2px}
html[dir="ltr"] .sheet .x.back svg{transform:scaleX(-1)}
@media (hover:hover) and (pointer:fine){.sheet .x.back:hover{background:rgba(255,255,255,.2)}}

/* opening QR: time left before the app comes in */
.i-qr-time{display:block;height:3px;margin:12px auto 0;width:72%;border-radius:99px;background:rgba(15,59,55,.14);overflow:hidden;position:relative}
.i-qr-time::after{content:"";position:absolute;inset:0;background:#0F3B37;opacity:.55;border-radius:inherit;transform-origin:0 50%}
html[dir="rtl"] .i-qr-time::after{transform-origin:100% 50%}
.i-qr-time.run::after{transform:scaleX(0);transition:transform var(--hold,10s) linear}
@media (prefers-reduced-motion: reduce){.i-qr-time{display:none}}

/* ---- 19 Nov: one shadow from the opening to the app ---- */
/* the opening picture casts the app's shadow from a wrapper, so the bottom fade never cuts it and the hand-over is identical */
.i-fig{position:absolute;inset:0;filter:drop-shadow(16px 10px 18px rgba(3,30,28,.38)) drop-shadow(4px 4px 6px rgba(3,30,28,.25))}
.i-nasser video,.i-nasser img,.i-nasser canvas{filter:none!important}
.intro .i-nasser .i-fig video,.intro .i-nasser .i-fig img{-webkit-mask-image:linear-gradient(180deg,#000 95%,transparent 100%)!important;mask-image:linear-gradient(180deg,#000 95%,transparent 100%)!important}
.intro .i-nasser .i-fig .i-canvas{
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 1.5%,#000 98.5%,transparent),linear-gradient(180deg,#000 95%,transparent 100%)!important;
          mask-image:linear-gradient(90deg,transparent,#000 1.5%,#000 98.5%,transparent),linear-gradient(180deg,#000 95%,transparent 100%)!important;
  -webkit-mask-composite:source-in;mask-composite:intersect}
/* no extra light pool under him in the opening and no extra halo behind him in the app: the same single shadow in both */
.i-nasser::after,.arch::before{display:none!important}
/* the app's Nasser is the same picture in the same place: swap in one frame, no crossfade (a crossfade doubles the shadow) */
.intro.handed .i-fig{visibility:hidden}

/* opening: the logo leaves quickly and Nasser arrives on the clip's own first frame, already moving into his first word */
.intro .i-logo{transition:opacity .45s cubic-bezier(.23,1,.32,1),transform .6s cubic-bezier(.23,1,.32,1)}
.intro .i-stage{will-change:opacity,transform;transform:translateY(14px);transition:opacity .6s cubic-bezier(.23,1,.32,1) .2s,transform .7s cubic-bezier(.23,1,.32,1) .2s}
.intro.play .i-stage{transform:none}
@media (prefers-reduced-motion: reduce){.intro .i-stage{transform:none;transition:opacity .3s ease}}

/* opening: the soft pool of white light under the hem is back, and the hem (with its shadow) fades into it, so there is no hard edge.
   At the hand-over the picture takes the app's own edge, as before */
.intro .i-nasser::after{display:block!important}
.intro.play:not(.out) .i-fig{-webkit-mask-image:linear-gradient(180deg,#000 94%,transparent 99%);mask-image:linear-gradient(180deg,#000 94%,transparent 99%)}
.intro.play:not(.out) .i-nasser .i-fig video,.intro.play:not(.out) .i-nasser .i-fig img{-webkit-mask-image:none!important;mask-image:none!important}
.intro.play:not(.out) .i-nasser .i-fig .i-canvas{
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 1.5%,#000 98.5%,transparent)!important;
          mask-image:linear-gradient(90deg,transparent,#000 1.5%,#000 98.5%,transparent)!important}

/* ---- hem and hand-over, refined ----
   The opening and the app now end Nasser's robe the same way (a soft fade that takes his shadow with it),
   so nothing about the hem or its shadow changes at the hand-over. */
.intro .i-fig{-webkit-mask-image:linear-gradient(180deg,#000 94%,transparent 99%)!important;mask-image:linear-gradient(180deg,#000 94%,transparent 99%)!important}
.intro .i-nasser .i-fig video,.intro .i-nasser .i-fig img{-webkit-mask-image:none!important;mask-image:none!important}
.intro .i-nasser .i-fig .i-canvas{
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 1.5%,#000 98.5%,transparent)!important;
          mask-image:linear-gradient(90deg,transparent,#000 1.5%,#000 98.5%,transparent)!important}
@media (min-width:900px) and (orientation:landscape), (min-width:1101px), (orientation:landscape) and (max-height:540px){
  #avatar{-webkit-mask-image:linear-gradient(180deg,#000 94%,transparent 99%);mask-image:linear-gradient(180deg,#000 94%,transparent 99%)}
  #avatar .nasser,#avatar .nasser-video{-webkit-mask-image:none!important;mask-image:none!important}
  #avatar .nasser-canvas{
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)!important;
            mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)!important}
}
/* opening clip <-> still: the incoming picture fades in over the outgoing one, which stays solid underneath until it is covered.
   (Fading both at once let the green background show through the middle of the change.) */
.intro.stacked.has-video .i-canvas{opacity:1;transition:none}
.intro.stacked.ending .i-canvas,.intro.stacked.landing .i-canvas{opacity:1!important;visibility:hidden;transition:visibility 0s linear .4s}
.intro.stacked.ending .i-still,.intro.stacked.landing .i-still{opacity:1!important;transition:opacity .35s cubic-bezier(.4,0,.2,1)!important}

/* hand-over to the app: the app's Nasser is already in place underneath; the opening picture drops its own shadow (so it is never
   doubled) and dissolves away over it, so a sub-pixel difference between the two pictures reads as one soft change, not an edge jump */
.intro.handed .i-fig{visibility:visible!important;filter:none!important;opacity:0;transition:opacity .32s cubic-bezier(.4,0,.2,1)}
@media (prefers-reduced-motion: reduce){.intro.handed .i-fig{transition:none}}

/* 3D piece in the details: photo stands in while it loads; grab cursor while turning */
.d-3d .d-3d-poster{position:absolute;inset:8%;width:84%;height:84%;object-fit:contain;transition:opacity .35s cubic-bezier(.23,1,.32,1);pointer-events:none;z-index:0}
.d-3d canvas{z-index:1}
.d-3d .d-3d-hint{z-index:2}
.d-3d.grabbing{cursor:grabbing}

/* the opening's QR, kept in the app on laptop / kiosk screens */
.app-qr{display:none}
@media (min-width:900px) and (orientation:landscape), (min-width:1101px), (orientation:landscape) and (max-height:540px){
  .app-qr{display:block;position:fixed;z-index:9;margin:0;text-align:center;pointer-events:none;transition:opacity .8s cubic-bezier(.4,0,.2,1)}
  .app-qr[hidden]{display:none}
  .app-qr img{display:block;width:100%;height:auto;box-sizing:border-box;padding:9px;border-radius:16px;background:#fff;
    box-shadow:0 0 0 1px rgba(255,255,255,.35),0 16px 34px -18px rgba(2,26,28,.7);image-rendering:pixelated}
  .app-qr figcaption{margin-top:8px;font:700 13px/1.45 "Tajawal",system-ui,sans-serif;color:#fff;text-shadow:0 1px 6px rgba(2,26,28,.45)}
  html.intro-on:not(.intro-reveal) .app-qr{opacity:0}
}

/* product card: the WhatsApp button floats in the corner and the title and description wrap around it */
.pc .inf .wa-fab{position:relative!important;float:left;top:auto!important;left:auto!important;right:auto!important;inset:auto!important;margin:1px 0 6px 10px}
html[dir=ltr] .pc .inf .wa-fab{float:right;margin:1px 10px 6px 0}
.pc .inf h4{padding-left:0!important;padding-right:0!important}
.pc .inf .acts{clear:both}

/* while a clip plays, the canvas draws Nasser's shadow itself: the box's CSS shadow eases out so it is never doubled,
   and eases back in as he returns to the still */
#avatar{transition:filter .3s ease}
#avatar.nv-stacked.nv-on:not(.nv-out){filter:drop-shadow(16px 10px 18px rgba(3,30,28,0)) drop-shadow(4px 4px 6px rgba(3,30,28,0))}

/* morph between clip and still: each layer carries its own shadow (the still's in CSS, the clip's drawn in WebGL), so nothing
   ever shadows a shadow; the still's shadow fades out as the clip fades in, and back as the clip fades out */
#avatar{filter:none!important;transition:none}
#avatar .nasser{filter:drop-shadow(16px 10px 18px rgba(3,30,28,.38)) drop-shadow(4px 4px 6px rgba(3,30,28,.25))!important;transition:opacity .3s ease,filter .3s ease}
#avatar.nv-stacked.nv-on:not(.nv-out) .nasser{filter:drop-shadow(16px 10px 18px rgba(3,30,28,0)) drop-shadow(4px 4px 6px rgba(3,30,28,0))!important;transition:opacity .3s ease .3s,filter .3s ease}
#avatar.nv-stacked.nv-out .nasser{transition:opacity 0s,filter .3s ease!important}

/* 3D: no stand-in photo; if the model is not ready within a moment a quiet ring turns in its place */
.d-3d .d-3d-poster{display:none}
.d-3d.is-loading::before{content:"";position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;
  border:2.5px solid rgba(255,255,255,.18);border-top-color:rgba(255,255,255,.8);animation:spin3d .9s linear infinite;z-index:0}
@keyframes spin3d{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ .d-3d.is-loading::before{animation-duration:2.4s} }

/* landscape: Nasser and his question cards stand a little toward the chat (the opening's Nasser too, so the hand-over
   lands in the same spot); the QR and the pause / mute rail sit in the space on his other side */
@media (min-width:900px) and (orientation:landscape), (min-width:1101px), (orientation:landscape) and (max-height:540px){

  .stage .qs{max-width:var(--qsw,none);justify-self:center;margin-inline:auto}
}

  const ready = typeof p === "string" && BLOBS.get(p); if (ready) return ready;
  if (typeof p === "string" && p.startsWith("data:video/")){
    let u = BLOBS.get(p);

function pinWatch(th){
  if (th._pin) return; th._pin = true; th.dataset.pinned = "1";

  // and once they let go they stay where they are unless they ended near the bottom
  th.addEventListener("scroll", () => { if (th._auto && !th._user) return; th.dataset.pinned = near() ? "1" : "0"; }, {passive:true});
  const down = () => { th._user = true; th._auto = false; clearTimeout(th._userT); };
  const up = () => { clearTimeout(th._userT); th._userT = setTimeout(() => { th._user = false; th.dataset.pinned = near() ? "1" : "0"; }, 450); };

  ["touchend","touchcancel","pointerup","wheel"].forEach(e => th.addEventListener(e, up, {passive:true}));
  th.addEventListener("scrollend", () => { th._auto = false; if (th._user) up(); });
  th.addEventListener("keydown", () => { th._auto = false; });
}
function scrollThreads(follow, stream){
  if (S.history.length <= 1){ $$("[data-thread]").forEach(th => { pinWatch(th); th.scrollTop = 0; }); return; }
  $$("[data-thread]").forEach(th => {
    pinWatch(th);

    if (th._user && !(follow === true && !stream)) return;        // never fight the finger while the answer streams
    if (th.dataset.pinned !== "1" || th.scrollHeight <= th.clientHeight + 2) return;
    const top = th.scrollHeight - th.clientHeight;
    if (Math.abs(top - th.scrollTop) < 2) return;
    if (reduce || stream){ th.scrollTop = top; return; }            // instant follow: lands at the bottom, so it stays pinned by itself
    th._auto = true; clearTimeout(th._autoT); th._autoT = setTimeout(() => { th._auto = false; }, 700);
    th.scrollTo({top, behavior: "smooth"});
  });
  // the page itself never scrolls: only the answer box does
  if (window.scrollY || document.documentElement.scrollTop) window.scrollTo(0,0);
}

      : "cubic-bezier(.34,1.4,.64,1)";
    box.animate([{width: w0 + "px", borderRadius: "22px"}, {width: w1 + "px"}], {duration: Math.min(700, 380 + Math.abs(w1 - w0) * .6), easing: SPRING});
  });
}

/* Clips come as "stacked alpha" MP4s: Nasser's colour on top, his cut-out (grey) underneath.
   A small WebGL canvas puts the two together, so he stands on the page with no background, in every browser.
   The canvas sits exactly over the still portrait; each clip starts from the same pose as the still and
   morphs in and out of it, so the change is never seen. */
/* draw a "stacked alpha" clip (colour on top, cut-out underneath) onto a canvas with WebGL */
function alphaGL(cv, withShadow){
  const gl = cv.getContext("webgl", {premultipliedAlpha:true, alpha:true, antialias:false});
  if (!gl) return null;
  const sh = (type, src) => { const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o); return o; };
  const VS = "attribute vec2 p;varying vec2 v;void main(){v=vec2((p.x+1.)*.5,(1.-p.y)*.5);gl_Position=vec4(p,0.,1.);}";
  const prog = fs => { const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr);
    return gl.getProgramParameter(pr, gl.LINK_STATUS) ? pr : null; };
  // the cut-out lives in the lower half of each frame; sample it half a texel inside its half (exactly on the seam,
  // linear filtering mixes in the picture's bottom row and draws a faint line along the top)
  const MATTE = "uniform sampler2D t;uniform float h;uniform float e;float al(vec2 q){if(q.x<0.||q.y<0.||q.x>1.||q.y>1.)return 0.;float a=texture2D(t,vec2(q.x,q.y*h+.5+e)).r;return clamp((a-.03)/.97,0.,1.);}";
  // the clip's own shadow is drawn here, built exactly like the still's CSS shadow:
  //   drop-shadow(16px 10px 18px rgba(3,30,28,.38)) then drop-shadow(4px 4px 6px rgba(3,30,28,.25))
  // In a CSS filter the blur length is the Gaussian's standard deviation (measured against the still: sigma 18px and 6px),
  // and the second shadow is cast by the figure *with* the first shadow, as CSS does.
  // (iPhone Safari does not draw a CSS drop-shadow on a live WebGL canvas, so it has to be part of the picture.)
  const pMain = prog("precision mediump float;varying vec2 v;" + MATTE + "uniform vec2 s;uniform float sw;uniform sampler2D s1;uniform sampler2D s2;uniform vec2 o1;uniform vec2 o2;" +
    "vec3 sh(float x){x=clamp((x-s.x)/s.y,0.,1.);vec3 a=vec3(1.),b=vec3(.8275,.8706,.8627),d=vec3(.6549,.7294,.7176);if(x<.56)return a;if(x<.8)return mix(a,b,(x-.56)/.24);return mix(b,d,(x-.8)/.2);}" +
    "float rd(sampler2D x,vec2 q){if(q.x<0.||q.y<0.||q.x>1.||q.y>1.)return 0.;return texture2D(x,vec2(q.x,1.-q.y)).r;}" +
    "void main(){vec3 c=texture2D(t,vec2(v.x,min(v.y*h,.5-e))).rgb*sh(v.x);float a=al(v);vec3 sc=vec3(.0118,.1176,.1098);" +
    " if(sw<.5){gl_FragColor=vec4(c*a,a);return;}" +

<script>
(() => {

    if (!wide.matches || !t || !a){ R.style.setProperty("--nx", "0px"); return; }
    R.style.setProperty("--nx", "0px"); R.style.setProperty("--qsw", "none");
    const tr = t.getBoundingClientRect(), ar = a.getBoundingClientRect();
    const toward = tr.left < ar.left ? -1 : 1;                       // toward the chat (left in Arabic, right in English)
    const gap = toward < 0 ? ar.left - tr.right : tr.left - ar.right;
    const want = Math.min(120, Math.max(56, innerWidth * .055));
    // the question cards move with him and stay centred under him: they may narrow a little, never under the chat
    const qs = document.querySelector(".stage .qs"), qr = qs && qs.offsetParent ? qs.getBoundingClientRect() : null;
    const MINQ = 600, pad = 16;
    let dx = Math.max(0, Math.min(want, gap - 24));
    if (qr){
      const qc = (qr.left + qr.right) / 2, edge = toward < 0 ? tr.right + pad : tr.left - pad;
      const half = c => toward < 0 ? c - edge : edge - c;              // room from the cards' centre to the chat
      dx = Math.max(0, Math.min(dx, half(qc) - MINQ / 2));
      const fit = 2 * half(qc + toward * dx);
      if (fit < qr.width) R.style.setProperty("--qsw", Math.floor(fit) + "px");
    }
    R.style.setProperty("--nx", (toward * Math.round(dx)) + "px");
  };
